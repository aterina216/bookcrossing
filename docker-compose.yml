services:
  postgres:
    image: postgres:16
    container_name: bookcrossing-db
    environment:
      POSTGRES_DB: bookcrossing
      POSTGRES_USER: bookcrossing
      POSTGRES_PASSWORD: bookcrossing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: